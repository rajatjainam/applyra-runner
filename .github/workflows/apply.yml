name: Applyra cloud apply
on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes (GitHub may delay scheduled runs a little)
  workflow_dispatch: {}
concurrency:
  group: applyra-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package.json') }}
      - run: "[ -d node_modules/playwright ] || npm install --no-audit --no-fund"
      - name: Anything queued?
        id: q
        run: node run.mjs --check
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: Browser (uses the runner's Google Chrome; installs Chromium only if Chrome is missing)
        if: steps.q.outputs.work == 'true'
        run: command -v google-chrome >/dev/null || npx playwright install --with-deps chromium
      - name: Apply
        if: steps.q.outputs.work == 'true'
        run: node run.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          APP_URL: ${{ vars.APP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          APPLYRA_RUNNER_SECRET: ${{ secrets.APPLYRA_RUNNER_SECRET }}
